<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <style>
        #recuadro1 {
            border-radius: 20px;
            background-color: #ff0;
            width: 200px;
            padding: 10px;
            transition: width 1s, background-color 4s;
        }
        #recuadro1:hover {
            width: 300px;
            background-color: #f00;
        }
        body {
            background-color: #ffffff;
            margin: 50px;
        }
    </style>
</head>
<body>
    <div id="recuadro1">
        <h3>Recuadro 1</h3>
        <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Libero magni ut repellendus sunt dolore in ipsum, inventore minus quaerat delectus ipsam aperiam, quisquam blanditiis at magnam! Necessitatibus deserunt similique quis?</p>
    </div>
</body>
</html>
