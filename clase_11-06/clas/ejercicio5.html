<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viñetas de imagen</title>
    <style>
        .lista {
            list-style-type: none;
            list-style-image: url(img/imagenes/css-tricks.ir.png);
            list-style-position: inside;
        }
    </style>
</head>
<body>
    <ul type="none">
        <li>Propiedades CSS separados</li>
        <ul class="lista">
            <li>lapiz</li>
            <li>pincel</li>
            <li>goma</li>
            <li>Cartulina</li>
        </ul>
    </ul>
    <hr>
    <ul style="list-style-type: none;">
        <li>Propiedades CSS juntas</li>
        <ul class="lista">
            <li>lapiz</li>
            <li>pincel</li>
            <li>goma</li>
            <li>Cartulina</li>
        </ul>
    </ul>
</body>
</html>
