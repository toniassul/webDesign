<!-- Ej01. crear un bloque de presentacion con bordes, márgenes y relleno-->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloques</title>
    <style>
        .presentacion {
            border: 2px solid #333;
            margin: 20px;
            padding: 15px;
        }
    </style>
</head>
<body>
    <div class="presentacion">
        <h2>Bienvenido</h2>
        <p>Este es un bloque con propiedades CSS aplicadas</p>
    </div>
</body>
</html>
